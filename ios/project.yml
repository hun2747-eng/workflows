name: NetLokator
options:
  bundleIdPrefix: hu.netlokator
  projectFormat: xcode14_0
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  NetLokator:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NetLokator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.netlokator.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "NetLokator"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  NetLokatorShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NetLokatorShare
      - path: NetLokator/HistoryStore.swift
      - path: NetLokator/NetworkService.swift
      - path: NetLokator/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.netlokator.app.share
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Send to Netlokator"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSExtension:
          NSExtensionPointIdentifier: "com.apple.share-services"
          NSExtensionPrincipalClass: "NetLokatorShare.ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 10
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: YES
