name: Build APK and iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetLokator-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Apple signing certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/signing_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/netlokator-signing.keychain-db"

          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH"             -P "$IOS_CERTIFICATE_PASSWORD"             -A             -t cert             -f pkcs12             -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Install Apple provisioning profiles
        env:
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$IOS_APP_PROFILE_BASE64" | base64 --decode             > "$HOME/Library/MobileDevice/Provisioning Profiles/NetLokator.mobileprovision"

          echo "$IOS_SHARE_PROFILE_BASE64" | base64 --decode             > "$HOME/Library/MobileDevice/Provisioning Profiles/NetLokatorShare.mobileprovision"

      - name: Read signing identities and provisioning profile names
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          CERT_IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/netlokator-signing.keychain-db"             | awk -F'"' '/Apple Distribution/ {print $2; exit}')

          if [ -z "$CERT_IDENTITY" ]; then
            echo "Apple Distribution certificate was not found in the imported keychain."
            exit 1
          fi

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          APP_PROFILE_PLIST="$RUNNER_TEMP/app-profile.plist"
          SHARE_PROFILE_PLIST="$RUNNER_TEMP/share-profile.plist"

          security cms -D -i "$PROFILE_DIR/NetLokator.mobileprovision" > "$APP_PROFILE_PLIST"
          security cms -D -i "$PROFILE_DIR/NetLokatorShare.mobileprovision" > "$SHARE_PROFILE_PLIST"

          APP_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$APP_PROFILE_PLIST")
          SHARE_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$SHARE_PROFILE_PLIST")

          echo "DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM" >> "$GITHUB_ENV"
          echo "CODE_SIGN_IDENTITY=$CERT_IDENTITY" >> "$GITHUB_ENV"
          echo "APP_PROVISIONING_PROFILE_NAME=$APP_PROFILE_NAME" >> "$GITHUB_ENV"
          echo "SHARE_PROVISIONING_PROFILE_NAME=$SHARE_PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Build signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          chmod +x ios/build_ipa.sh
          ./ios/build_ipa.sh

      - name: Upload signed iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: NetLokator-iOS-IPA
          path: ios/build/NetLokator.ipa
          if-no-files-found: error
